name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping panel (prevents Render free-tier spin-down)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://jayo.vyluxtech.com/)
          echo "jayo -> HTTP $code"
          if [ "$code" != "200" ]; then sleep 45; curl -s -o /dev/null -w 'retry: %{http_code}\n' --max-time 30 https://jayo.vyluxtech.com/; fi
      - name: Ping frontend
        run: curl -s -o /dev/null -w 'top -> HTTP %{http_code}\n' --max-time 30 https://top.vyluxtech.com/
