name: heartbeat
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: date -u +'%Y-%m-%dT%H:%M:%SZ' > .last_ping
      - uses: EndBug/add-and-commit@v9
        with:
          message: 'heartbeat: weekly activity commit keeps the cron schedule enabled'
          add: '.last_ping'
